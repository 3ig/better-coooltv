name: Build APK

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish GitHub Releases for v* tags

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="0.1.0-ci.${GITHUB_RUN_NUMBER}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish a debug-signed release
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing; a tagged release must be signed with the release key."
          exit 1

      - name: Release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ORG_GRADLE_PROJECT_coooltvReleaseStoreFile=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_coooltvReleaseStorePassword: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_coooltvReleaseKeyAlias: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_coooltvReleaseKeyPassword: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew :app:assembleRelease --no-daemon
          -PappVersionCode=${{ steps.ver.outputs.code }}
          -PappVersionName=${{ steps.ver.outputs.name }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "coool-tv-lite-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: coool-tv-lite-${{ steps.ver.outputs.name }}
          path: coool-tv-lite-*.apk

      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          APK="coool-tv-lite-${VERSION}.apk"
          sha256sum "$APK" > "$APK.sha256"
          # Section between "## [VERSION]" and the next "## [" heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { next }
            on { print }
          ' CHANGELOG.md > section.md
          if [ ! -s section.md ]; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' section"
            exit 1
          fi
          {
            cat section.md
            echo
            echo "### Install"
            echo
            echo "Download **${APK}** below and sideload it (e.g. \`adb install ${APK}\`), or update from inside the app."
            echo "Needs Android TV / Google TV / Fire TV with Android 7.0+. SHA-256: \`$(cut -d' ' -f1 "$APK.sha256")\`"
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Coool TV Lite ${{ steps.ver.outputs.name }}
          body_path: release-notes.md
          files: |
            coool-tv-lite-*.apk
            coool-tv-lite-*.apk.sha256
